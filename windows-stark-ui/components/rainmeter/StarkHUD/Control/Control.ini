[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Stark HUD - Control Center
Author=Stark HUD UI Pack
Information=Control center stile HyperOS: scorciatoie alle impostazioni di Windows. Statico (Update=-1): zero consumo.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
CardW=300
CardH=176

[sBtn]
Shape=Ellipse (23*#Scale#),(23*#Scale#),(22*#Scale#) | Fill Color #ButtonFill# | StrokeWidth 1 | Stroke Color #Line#
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Ellipse (23*#Scale#),(23*#Scale#),(22*#Scale#) | Fill Color #HoverFill# | StrokeWidth 1 | Stroke Color #HoverLine#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Ellipse (23*#Scale#),(23*#Scale#),(22*#Scale#) | Fill Color #ButtonFill# | StrokeWidth 1 | Stroke Color #Line#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
AntiAlias=1

[sGlyph]
FontFace=#FontIcon#
FontSize=(12*#Scale#)
FontColor=#Text#
StringAlign=CenterCenter
AntiAlias=1

[MeterCard]
Meter=Shape
MeterStyle=sCard

[MeterTitle]
Meter=String
MeterStyle=sTitle
X=(20*#Scale#)
Y=(16*#Scale#)
Text=Control

[MeterTitleTag]
Meter=String
MeterStyle=sMono
X=(4*#Scale#)R
Y=(2*#Scale#)r
Text=// CENTER

[MeterBtnWifi]
Meter=Shape
MeterStyle=sBtn
X=(28*#Scale#)
Y=(53*#Scale#)
LeftMouseUpAction=["ms-settings:network-wifi"]
ToolTipText=Wi-Fi

[MeterGlyphWifi]
Meter=String
MeterStyle=sGlyph
X=(51*#Scale#)
Y=(76*#Scale#)
Text=[\xE701]

[MeterBtnBluetooth]
Meter=Shape
MeterStyle=sBtn
X=(94*#Scale#)
Y=(53*#Scale#)
LeftMouseUpAction=["ms-settings:bluetooth"]
ToolTipText=Bluetooth

[MeterGlyphBluetooth]
Meter=String
MeterStyle=sGlyph
X=(117*#Scale#)
Y=(76*#Scale#)
Text=[\xE702]

[MeterBtnSound]
Meter=Shape
MeterStyle=sBtn
X=(160*#Scale#)
Y=(53*#Scale#)
LeftMouseUpAction=["ms-settings:sound"]
ToolTipText=Audio

[MeterGlyphSound]
Meter=String
MeterStyle=sGlyph
X=(183*#Scale#)
Y=(76*#Scale#)
Text=[\xE767]

[MeterBtnDisplay]
Meter=Shape
MeterStyle=sBtn
X=(226*#Scale#)
Y=(53*#Scale#)
LeftMouseUpAction=["ms-settings:display"]
ToolTipText=Schermo e luminosita

[MeterGlyphDisplay]
Meter=String
MeterStyle=sGlyph
X=(249*#Scale#)
Y=(76*#Scale#)
Text=[\xE706]

[MeterBtnFocus]
Meter=Shape
MeterStyle=sBtn
X=(28*#Scale#)
Y=(115*#Scale#)
LeftMouseUpAction=["ms-settings:quiethours"]
ToolTipText=Notifiche / Non disturbare

[MeterGlyphFocus]
Meter=String
MeterStyle=sGlyph
X=(51*#Scale#)
Y=(138*#Scale#)
Text=[\xE708]

[MeterBtnFiles]
Meter=Shape
MeterStyle=sBtn
X=(94*#Scale#)
Y=(115*#Scale#)
LeftMouseUpAction=["explorer.exe"]
ToolTipText=Esplora file

[MeterGlyphFiles]
Meter=String
MeterStyle=sGlyph
X=(117*#Scale#)
Y=(138*#Scale#)
Text=[\xE8B7]

[MeterBtnSettings]
Meter=Shape
MeterStyle=sBtn
X=(160*#Scale#)
Y=(115*#Scale#)
LeftMouseUpAction=["ms-settings:"]
ToolTipText=Impostazioni

[MeterGlyphSettings]
Meter=String
MeterStyle=sGlyph
X=(183*#Scale#)
Y=(138*#Scale#)
Text=[\xE713]

[MeterBtnPower]
Meter=Shape
MeterStyle=sBtn
X=(226*#Scale#)
Y=(115*#Scale#)
LeftMouseUpAction=["SlideToShutDown.exe"]
ToolTipText=Spegni (scorri per confermare)

[MeterGlyphPower]
Meter=String
MeterStyle=sGlyph
X=(249*#Scale#)
Y=(138*#Scale#)
Text=[\xE7E8]
