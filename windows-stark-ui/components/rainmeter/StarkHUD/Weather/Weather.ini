[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Stark HUD - Weather
Author=Stark HUD UI Pack
Information=Meteo da wttr.in (nessuna API key). Citta' in @Resources\Variables.inc (vuoto = automatica).
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
CardW=220
CardH=176

; ---------------------------------------------------------------- misure
; Aggiornamento ogni 30 minuti (Update 1000 ms x UpdateRate 1800)
[MeasureWeather]
Measure=WebParser
URL=https://wttr.in/#City#?format=%t|%C|%h|%w&lang=it&m
RegExp=(?siU)^(.*)\|(.*)\|(.*)\|(.*)$
UpdateRate=1800
CodePage=65001
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1
Substitute="+":"","C":"","F":"","":"--"

[MeasureCond]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2
Substitute="":"in aggiornamento..."

[MeasureHum]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureWind]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4

; ---------------------------------------------------------------- grafica
[MeterCard]
Meter=Shape
MeterStyle=sCard
LeftMouseUpAction=["https://wttr.in/#City#"]
ToolTipText=Apri le previsioni complete

[MeterTitle]
Meter=String
MeterStyle=sTitle
X=(20*#Scale#)
Y=(16*#Scale#)
Text=Weather

[MeterTitleTag]
Meter=String
MeterStyle=sMono
X=(4*#Scale#)R
Y=(2*#Scale#)r
Text=// LIVE

[MeterTemp]
Meter=String
MeterStyle=sText
MeasureName=MeasureTemp
X=(16*#Scale#)
Y=(34*#Scale#)
FontWeight=300
FontSize=(40*#Scale#)
Text=%1

[MeterCond]
Meter=String
MeterStyle=sText
MeasureName=MeasureCond
X=(20*#Scale#)
Y=(100*#Scale#)
W=(184*#Scale#)
ClipString=1
FontColor=#Text#
Text=%1

[MeterHum]
Meter=String
MeterStyle=sMono
MeasureName=MeasureHum
X=(20*#Scale#)
Y=(128*#Scale#)
Text=UMIDITA  %1

[MeterWind]
Meter=String
MeterStyle=sMono
MeasureName=MeasureWind
X=(20*#Scale#)
Y=(144*#Scale#)
Text=VENTO  %1
