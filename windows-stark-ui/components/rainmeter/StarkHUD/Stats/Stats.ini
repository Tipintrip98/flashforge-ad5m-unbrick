[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Stark HUD - Telemetry
Author=Stark HUD UI Pack
Information=Anelli stile Apple Watch per CPU / RAM / disco + rete e uptime. Aggiornamento 1 s, costo CPU minimo.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
CardW=320
CardH=176

; ---------------------------------------------------------------- misure
[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=30

[MeasureNetIn]
Measure=NetIn
Interface=Best
DynamicVariables=1

[MeasureNetOut]
Measure=NetOut
Interface=Best
DynamicVariables=1

[MeasureUptime]
Measure=Uptime
Format="%4!i!d %3!02i!:%2!02i!"

; ---------------------------------------------------------------- scheda
[MeterCard]
Meter=Shape
MeterStyle=sCard
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Apri Gestione attivita'

[MeterTitle]
Meter=String
MeterStyle=sTitle
X=(20*#Scale#)
Y=(16*#Scale#)
Text=System

[MeterTitleTag]
Meter=String
MeterStyle=sMono
X=(4*#Scale#)R
Y=(2*#Scale#)r
Text=// TELEMETRY

; ---------------------------------------------------------------- anelli (centro 78,98)
[MeterCPUTrack]
Meter=Roundline
X=(22*#Scale#)
Y=(42*#Scale#)
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(47*#Scale#)
LineLength=(55*#Scale#)
Solid=1
LineColor=#AccentSoft#
AntiAlias=1

[MeterCPURing]
Meter=Roundline
MeasureName=MeasureCPU
X=0r
Y=0r
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(47*#Scale#)
LineLength=(55*#Scale#)
Solid=1
LineColor=#Accent#
AntiAlias=1

[MeterRAMTrack]
Meter=Roundline
X=0r
Y=0r
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(37*#Scale#)
LineLength=(45*#Scale#)
Solid=1
LineColor=#GoldSoft#
AntiAlias=1

[MeterRAMRing]
Meter=Roundline
MeasureName=MeasureRAM
X=0r
Y=0r
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(37*#Scale#)
LineLength=(45*#Scale#)
Solid=1
LineColor=#Gold#
AntiAlias=1

[MeterDiskTrack]
Meter=Roundline
X=0r
Y=0r
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(27*#Scale#)
LineLength=(35*#Scale#)
Solid=1
LineColor=#IceSoft#
AntiAlias=1

[MeterDiskRing]
Meter=Roundline
MeasureName=MeasureDisk
X=0r
Y=0r
W=(112*#Scale#)
H=(112*#Scale#)
StartAngle=4.7124
RotationAngle=6.2832
LineStart=(27*#Scale#)
LineLength=(35*#Scale#)
Solid=1
LineColor=#Ice#
AntiAlias=1

[MeterCore]
Meter=Shape
X=(68*#Scale#)
Y=(88*#Scale#)
Shape=Ellipse (10*#Scale#),(10*#Scale#),(9*#Scale#) | Fill Color 56,214,255,60 | StrokeWidth 0
Shape2=Ellipse (10*#Scale#),(10*#Scale#),(4*#Scale#) | Fill Color 230,250,255,255 | StrokeWidth 0

; ---------------------------------------------------------------- legenda
[MeterDots]
Meter=Shape
X=(150*#Scale#)
Y=(50*#Scale#)
Shape=Ellipse (3*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #Accent# | StrokeWidth 0
Shape2=Ellipse (3*#Scale#),(25*#Scale#),(3*#Scale#) | Fill Color #Gold# | StrokeWidth 0
Shape3=Ellipse (3*#Scale#),(47*#Scale#),(3*#Scale#) | Fill Color #Ice# | StrokeWidth 0

[MeterLblCPU]
Meter=String
MeterStyle=sMono
X=(162*#Scale#)
Y=(45*#Scale#)
Text=CPU

[MeterValCPU]
Meter=String
MeterStyle=sValue
MeasureName=MeasureCPU
X=(300*#Scale#)
Y=0r
NumOfDecimals=0
Text=%1%

[MeterLblRAM]
Meter=String
MeterStyle=sMono
X=(162*#Scale#)
Y=(67*#Scale#)
Text=RAM

[MeterValRAM]
Meter=String
MeterStyle=sValue
X=(300*#Scale#)
Y=0r
DynamicVariables=1
Text=[MeasureRAM:/1073741824,1] / [MeasureRAMTotal:/1073741824,0] GB

[MeterLblDisk]
Meter=String
MeterStyle=sMono
X=(162*#Scale#)
Y=(89*#Scale#)
Text=DISK C:

[MeterValDisk]
Meter=String
MeterStyle=sValue
MeasureName=MeasureDisk
X=(300*#Scale#)
Y=0r
Percentual=1
NumOfDecimals=0
Text=%1%

[MeterSep]
Meter=Shape
X=(150*#Scale#)
Y=(112*#Scale#)
Shape=Rectangle 0,0,(150*#Scale#),1 | Fill Color #Line# | StrokeWidth 0

[MeterLblNet]
Meter=String
MeterStyle=sMono
X=(150*#Scale#)
Y=(120*#Scale#)
Text=NET

[MeterValNet]
Meter=String
MeterStyle=sValue
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=(300*#Scale#)
Y=0r
AutoScale=1
NumOfDecimals=1
Text=[\x2193] %1B  [\x2191] %2B

[MeterLblUp]
Meter=String
MeterStyle=sMono
X=(150*#Scale#)
Y=(140*#Scale#)
Text=UPTIME

[MeterValUp]
Meter=String
MeterStyle=sValue
MeasureName=MeasureUptime
X=(300*#Scale#)
Y=0r
FontColor=#Muted#
Text=%1
