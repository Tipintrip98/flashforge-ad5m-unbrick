[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Stark HUD - Clock
Author=Stark HUD UI Pack
Information=Orologio grande stile Apple TV con etichette HUD.
Version=1.0
License=MIT

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

; ---------------------------------------------------------------- misure
[MeasureTime]
Measure=Time
Format=#TimeFormat#

[MeasureDate]
Measure=Time
Format=%A   %#d   %B
FormatLocale=Local

; ---------------------------------------------------------------- grafica
[MeterTag]
Meter=String
MeterStyle=sMono
X=(6*#Scale#)
Y=0
Text=LOCAL TIME  //  STARK HUD

[MeterTime]
Meter=String
MeterStyle=sText
MeasureName=MeasureTime
X=0
Y=(-6*#Scale#)R
FontWeight=300
FontSize=(92*#Scale#)
Text=%1

[MeterDate]
Meter=String
MeterStyle=sText
MeasureName=MeasureDate
X=(7*#Scale#)
Y=(-18*#Scale#)R
FontSize=(15*#Scale#)
FontColor=#Accent#
StringCase=Upper
InlineSetting=CharacterSpacing | 5 | 5
Text=%1

[MeterRule]
Meter=Shape
X=(7*#Scale#)
Y=(12*#Scale#)R
Shape=Rectangle 0,0,(220*#Scale#),1 | Fill LinearGradient Rule | StrokeWidth 0
Rule=180 | 56,214,255,200 ; 0.0 | 56,214,255,0 ; 1.0
Shape2=Rectangle 0,(-2*#Scale#),(26*#Scale#),(3*#Scale#) | Fill Color #Gold# | StrokeWidth 0
