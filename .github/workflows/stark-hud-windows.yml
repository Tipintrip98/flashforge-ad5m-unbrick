# Tipaldi AI - test su Windows reale (runner GitHub usa e getta)
# Installa il pack, lo verifica con le API di Windows, lo ripristina e confronta il registro.
name: Tipaldi AI - test Windows

# Solo avvio manuale (Actions -> "Tipaldi AI - test Windows" -> Run workflow):
# nessuna esecuzione automatica, quindi nessun minuto consumato senza che tu lo chieda.
on:
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.os }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            mode: nativo
          - os: windows-2025
            mode: componenti
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
        working-directory: windows-stark-ui
    steps:
      - uses: actions/checkout@v4

      - name: Test unitari (Windows PowerShell 5.1)
        run: .\tests\Test-StarkCore.ps1

      - name: "Tipaldi AI: compilazione"
        run: .\agent\build.ps1

      - name: "Tipaldi AI: autotest"
        run: |
          $out = Join-Path $PWD 'tests\out\selftest'
          $p = Start-Process -FilePath .\agent\bin\TipaldiAI.exe -ArgumentList @('--selftest', "`"$out`"") -PassThru -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          $null = $p.Handle; $p.WaitForExit()
          Get-Content selftest.txt, selftest-err.txt
          exit $p.ExitCode

      - name: "Tipaldi AI: desktop"
        run: |
          New-Item -ItemType Directory -Path tests\out -Force | Out-Null
          $png = Join-Path $PWD 'tests\out\tipaldi-desktop.png'
          $p = Start-Process -FilePath .\agent\bin\TipaldiAI.exe -ArgumentList @('--hud-screenshot', "`"$png`"") -PassThru -RedirectStandardError hud-err.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p | Stop-Process -Force; Write-Host 'timeout'; exit 1 }
          Get-Content hud-err.txt
          if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { exit 1 }
          if ('${{ matrix.mode }}' -eq 'nativo') {
            Add-Type -AssemblyName System.Drawing
            $img = [Drawing.Image]::FromFile($png)
            $small = New-Object Drawing.Bitmap 1280, 720
            $g = [Drawing.Graphics]::FromImage($small); $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($img, 0, 0, 1280, 720); $g.Dispose()
            $codec = [Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $ep = New-Object Drawing.Imaging.EncoderParameters 1
            $ep.Param[0] = New-Object Drawing.Imaging.EncoderParameter ([Drawing.Imaging.Encoder]::Quality), 82L
            $ms = New-Object IO.MemoryStream
            $small.Save($ms, $codec, $ep)
            Write-Host '=====BEGIN HUD====='
            Write-Host ([Convert]::ToBase64String($ms.ToArray()))
            Write-Host '=====END HUD====='
          }

      - name: Ambiente
        run: |
          [Environment]::OSVersion.VersionString
          $PSVersionTable.PSVersion.ToString()
          Get-Command winget.exe -ErrorAction SilentlyContinue | Select-Object Source
          if (Get-Command winget.exe -ErrorAction SilentlyContinue) { winget --version }
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId

      - name: Installazione, verifica e ripristino
        env:
          STARK_PRINT_SCREENSHOTS: ${{ matrix.mode == 'nativo' && '1' || '' }}
        run: |
          $components = '${{ matrix.mode }}' -eq 'componenti'
          & .\tests\Test-StarkWindows.ps1 -Components:$components
          exit $LASTEXITCODE

      - name: Log e screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stark-hud-${{ matrix.os }}-${{ matrix.mode }}
          path: windows-stark-ui/tests/out/
          if-no-files-found: ignore

  # Desktop Tipaldi AI dentro la shell vera di Windows: gerarchia delle finestre di Esplora risorse,
  # livello sfondo dietro alle icone, clic inoltrati, riaggancio dopo il riavvio di Esplora risorse.
  # windows-2022 ha la shell di Windows 10 (build 20348), windows-2025 quella di Windows 11.
  shell:
    name: shell di Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: windows-stark-ui
    steps:
      - uses: actions/checkout@v4
      - name: "Tipaldi AI: compilazione"
        run: .\agent\build.ps1
      - name: Integrazione con il desktop di Esplora risorse
        run: |
          & .\tests\Test-StarkShell.ps1
          if ($LASTEXITCODE -ne 2) { exit $LASTEXITCODE }
          # il job gira senza desktop interattivo: se l'utente del runner ha una sessione con desktop, il test
          # viene ripetuto li' con un'attivita' pianificata interattiva
          Write-Host "Sessioni di Windows:"; query session
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId | Format-Table | Out-String | Write-Host
          $log = Join-Path $env:TEMP 'tipaldi-shell.log'
          $wrapper = Join-Path $env:TEMP 'tipaldi-shell.ps1'
          Set-Content -Path $wrapper -Encoding UTF8 -Value @(
            "& '$PWD\tests\Test-StarkShell.ps1' *> '$log'",
            "Set-Content -Path '$log.done' -Value `$LASTEXITCODE")
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$wrapper`""
          $principal = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType Interactive -RunLevel Highest
          Register-ScheduledTask -TaskName 'TipaldiShell' -Action $action -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName 'TipaldiShell'
          $end = (Get-Date).AddMinutes(6)
          while (-not (Test-Path "$log.done") -and (Get-Date) -lt $end) { Start-Sleep -Seconds 3 }
          Write-Host "Stato attivita': $((Get-ScheduledTask -TaskName 'TipaldiShell').State) / $((Get-ScheduledTaskInfo -TaskName 'TipaldiShell').LastTaskResult)"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if (-not (Test-Path "$log.done")) { Write-Host 'Nessuna sessione interattiva disponibile sul runner.'; exit 1 }
          exit [int](Get-Content "$log.done")

  # Sul runner windows-2022 winget non c'e', come sul PC dell'utente: l'installer deve installarlo da solo
  winget:
    name: winget assente (installazione automatica)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: windows-stark-ui
    steps:
      - uses: actions/checkout@v4
      - name: Installa winget e un'app del Livello 2
        run: |
          Import-Module .\src\StarkHUD.psm1 -Force
          Set-StarkLogger { param($m, $l, $p) Write-Host ("[{0}] {1}" -f $l.ToUpper(), $m) }
          $before = Find-StarkWinget -Refresh
          Write-Host "winget prima: $before"
          if (-not (Install-StarkWinget)) { exit 1 }
          $exe = Find-StarkWinget -Refresh
          Write-Host "winget dopo: $exe"
          & $exe --version
          if (-not (Test-StarkEnvironment).HasWinget) { Write-Host 'HasWinget falso'; exit 1 }
          $ok = Install-StarkApp -Id 'Flow-Launcher.Flow-Launcher' -Name 'Flow Launcher'
          if (-not $ok) { exit 1 }
          if (-not (Test-StarkWingetPackage -Id 'Flow-Launcher.Flow-Launcher')) { Write-Host 'Flow Launcher non risulta installato'; exit 1 }
          Write-Host 'OK: winget installato da solo e app del Livello 2 installata.'

  # Un solo file da scaricare e avviare: W\TipaldiAI-Setup.exe (contiene tutto il pack).
  # Viene ricostruito solo quando cambia il pack, verificato e salvato nella cartella W del branch.
  setup-exe:
    name: TipaldiAI-Setup.exe
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: "Tipaldi AI: compilazione"
        run: .\windows-stark-ui\agent\build.ps1

      - name: Costruzione (solo se il pack e' cambiato)
        id: build
        run: |
          $r = & .\windows-stark-ui\tools\Build-Setup.ps1
          Add-Content -Path $env:GITHUB_OUTPUT -Value "built=$($r.Built.ToString().ToLower())" -Encoding Ascii

      - name: Verifica dell'exe
        run: |
          & .\windows-stark-ui\tests\Test-StarkSetup.ps1 -Exe .\W\TipaldiAI-Setup.exe
          exit $LASTEXITCODE

      - name: Salvataggio nella cartella W
        if: steps.build.outputs.built == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A W
          git commit -m "W: TipaldiAI-Setup.exe ricostruito dal pack attuale"
          # nel frattempo il branch puo' essere avanzato: si riparte da li' se l'exe e' ancora quello giusto
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stark-hud-setup-exe
          path: windows-stark-ui/tests/out/
          if-no-files-found: ignore
